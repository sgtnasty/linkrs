<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>linkrs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #666d78;
    --border: #dfe2e6;
    --accent: #3b6ef6;
    --accent-hover: #2f56c4;
    --danger: #d1453d;
    --danger-hover: #ab372f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1d2026;
      --text: #ecedef;
      --muted: #9aa1ac;
      --border: #2b2f37;
      --accent: #6690ff;
      --accent-hover: #86a7ff;
      --danger: #e5665f;
      --danger-hover: #f08983;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.25rem 4rem;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 1.25rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }
  .row {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .row > * { flex: 1 1 200px; }
  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 0.3rem;
  }
  input[type=text], input[type=url], input[type=password] {
    width: 100%;
    padding: 0.55rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-size: 0.95rem;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 0.6rem 1.1rem;
    font-size: 0.9rem;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
  }
  button:hover { background: var(--accent-hover); }
  button.danger { background: var(--danger); }
  button.danger:hover { background: var(--danger-hover); }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .search {
    margin-bottom: 1rem;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 0.65rem 0.5rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  th { color: var(--muted); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  .sort-indicator { display: inline-block; width: 1em; margin-left: 0.2rem; }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { margin-left: 0.4rem; padding: 0.35rem 0.7rem; font-size: 0.8rem; }
  a.link-url { color: var(--accent); text-decoration: none; word-break: break-all; }
  a.link-url:hover { text-decoration: underline; }
  .empty { color: var(--muted); text-align: center; padding: 2rem 0; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.4rem; }
  .tag-badge {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--accent);
    border-radius: 999px;
    padding: 0.15rem 0.65rem;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .tag-badge:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tag-filter-bar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.6rem;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .tag-filter-bar button { padding: 0.25rem 0.65rem; font-size: 0.75rem; }
  .form-actions { margin-top: 1rem; display: flex; gap: 0.6rem; }
  .auth-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .auth-bar button { padding: 0.4rem 0.8rem; font-size: 0.8rem; }
  .login-card .row { align-items: flex-end; }
  .login-card button { flex: 0 0 auto; }
  .error-text { color: var(--danger); font-size: 0.85rem; margin-top: 0.5rem; min-height: 1.1em; }
  .hint { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>linkrs</h1>

  <div class="auth-bar">
    <span id="auth-status"></span>
    <button type="button" class="secondary" id="logout-btn" style="display:none">Log out</button>
  </div>

  <div class="card login-card" id="login-card">
    <form id="login-form">
      <div class="row">
        <div>
          <label for="login-username">Username</label>
          <input type="text" id="login-username" required autocomplete="username">
        </div>
        <div>
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password">
        </div>
        <button type="submit">Log in</button>
      </div>
      <div class="error-text" id="login-error"></div>
    </form>
  </div>

  <div class="card" id="link-form-card" style="display:none">
    <form id="link-form">
      <input type="hidden" id="link-id">
      <div class="row">
        <div>
          <label for="link-name">Name</label>
          <input type="text" id="link-name" required maxlength="200">
        </div>
        <div>
          <label for="link-url">URL</label>
          <input type="url" id="link-url" required maxlength="2000" placeholder="https://example.com">
        </div>
      </div>
      <div class="row">
        <div>
          <label for="link-tags">Tags</label>
          <input type="text" id="link-tags" maxlength="500" placeholder="comma-separated, e.g. rust, self-hosted (stored lowercase)">
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" id="submit-btn">Add link</button>
        <button type="button" class="secondary" id="cancel-btn" style="display:none">Cancel</button>
      </div>
    </form>
  </div>

  <div class="hint" id="readonly-hint" style="display:none; margin-bottom:1.25rem;">
    Log in above to add, edit, or delete links.
  </div>

  <div class="search">
    <input type="text" id="search-box" placeholder="Search by name or URL...">
    <div class="tag-filter-bar" id="tag-filter-bar" style="display:none">
      Filtering by tag: <strong id="tag-filter-label"></strong>
      <button type="button" class="secondary" id="clear-tag-filter">Clear</button>
    </div>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="name">Name<span class="sort-indicator"></span></th>
          <th class="sortable" data-sort="url">URL<span class="sort-indicator"></span></th>
          <th class="sortable" data-sort="date_modified">Modified<span class="sort-indicator"></span></th>
          <th></th>
        </tr>
      </thead>
      <tbody id="link-rows"></tbody>
    </table>
    <div class="empty" id="empty-state" style="display:none">No links yet.</div>
  </div>
</div>

<script>
const form = document.getElementById('link-form');
const idField = document.getElementById('link-id');
const nameField = document.getElementById('link-name');
const urlField = document.getElementById('link-url');
const tagsField = document.getElementById('link-tags');
const submitBtn = document.getElementById('submit-btn');
const cancelBtn = document.getElementById('cancel-btn');
const searchBox = document.getElementById('search-box');
const rowsBody = document.getElementById('link-rows');
const emptyState = document.getElementById('empty-state');
const tagFilterBar = document.getElementById('tag-filter-bar');
const tagFilterLabel = document.getElementById('tag-filter-label');
const clearTagFilterBtn = document.getElementById('clear-tag-filter');

const authStatus = document.getElementById('auth-status');
const logoutBtn = document.getElementById('logout-btn');
const loginCard = document.getElementById('login-card');
const loginForm = document.getElementById('login-form');
const loginUsername = document.getElementById('login-username');
const loginPassword = document.getElementById('login-password');
const loginError = document.getElementById('login-error');
const linkFormCard = document.getElementById('link-form-card');
const readonlyHint = document.getElementById('readonly-hint');

let searchTimer = null;
let currentUser = null;
let currentLinks = [];
let activeTag = null;
let sortColumn = null;
let sortDirection = 'asc';

const sortableHeaders = document.querySelectorAll('th.sortable');
sortableHeaders.forEach((th) => {
  th.addEventListener('click', () => {
    const col = th.dataset.sort;
    sortDirection = sortColumn === col && sortDirection === 'asc' ? 'desc' : 'asc';
    sortColumn = col;
    updateSortIndicators();
    renderLinks(currentLinks);
  });
});

function updateSortIndicators() {
  sortableHeaders.forEach((th) => {
    const indicator = th.querySelector('.sort-indicator');
    indicator.textContent = th.dataset.sort === sortColumn
      ? (sortDirection === 'asc' ? '▲' : '▼')
      : '';
  });
}

function sortLinks(links) {
  if (!sortColumn) return links;
  const dir = sortDirection === 'asc' ? 1 : -1;
  return [...links].sort((a, b) => {
    let av = a[sortColumn];
    let bv = b[sortColumn];
    if (sortColumn === 'date_modified') {
      av = new Date(av).getTime();
      bv = new Date(bv).getTime();
    } else {
      av = (av || '').toLowerCase();
      bv = (bv || '').toLowerCase();
    }
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return 0;
  });
}

function formatDate(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleString();
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function checkAuth() {
  const res = await fetch('/api/me');
  currentUser = res.ok ? (await res.json()).username : null;
  renderAuthUI();
}

function renderAuthUI() {
  if (currentUser) {
    authStatus.textContent = `Signed in as ${currentUser}`;
    logoutBtn.style.display = 'inline-block';
    loginCard.style.display = 'none';
    linkFormCard.style.display = 'block';
    readonlyHint.style.display = 'none';
  } else {
    authStatus.textContent = 'Not signed in';
    logoutBtn.style.display = 'none';
    loginCard.style.display = 'block';
    linkFormCard.style.display = 'none';
    readonlyHint.style.display = 'block';
    resetForm();
  }
  renderLinks(currentLinks);
}

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginError.textContent = '';
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: loginUsername.value, password: loginPassword.value }),
  });
  if (!res.ok) {
    loginError.textContent = 'Invalid username or password.';
    return;
  }
  loginForm.reset();
  await checkAuth();
});

logoutBtn.addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  currentUser = null;
  renderAuthUI();
});

async function fetchLinks() {
  const q = searchBox.value.trim();
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (activeTag) params.set('tag', activeTag);
  const qs = params.toString();
  const res = await fetch(qs ? `/api/links?${qs}` : '/api/links');
  currentLinks = await res.json();
  renderLinks(currentLinks);
}

function renderTags(tags) {
  if (!tags || tags.length === 0) return '';
  const badges = tags.map((t) =>
    `<button type="button" class="tag-badge" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</button>`
  ).join('');
  return `<div class="tag-list">${badges}</div>`;
}

function renderLinks(links) {
  const sorted = sortLinks(links);
  rowsBody.innerHTML = '';
  emptyState.style.display = sorted.length === 0 ? 'block' : 'none';
  for (const link of sorted) {
    const tr = document.createElement('tr');
    const actions = currentUser
      ? `<button type="button" class="secondary edit-btn">Edit</button>
         <button type="button" class="danger delete-btn">Delete</button>`
      : '';
    tr.innerHTML = `
      <td>${escapeHtml(link.name)}${renderTags(link.tags)}</td>
      <td><a class="link-url" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.url)}</a></td>
      <td>${formatDate(link.date_modified)}</td>
      <td class="actions">${actions}</td>
    `;
    if (currentUser) {
      tr.querySelector('.edit-btn').addEventListener('click', () => startEdit(link));
      tr.querySelector('.delete-btn').addEventListener('click', () => deleteLink(link));
    }
    tr.querySelectorAll('.tag-badge').forEach((badge) => {
      badge.addEventListener('click', () => setTagFilter(badge.dataset.tag));
    });
    rowsBody.appendChild(tr);
  }
}

function setTagFilter(tag) {
  activeTag = tag;
  tagFilterLabel.textContent = tag;
  tagFilterBar.style.display = 'flex';
  fetchLinks();
}

clearTagFilterBtn.addEventListener('click', () => {
  activeTag = null;
  tagFilterBar.style.display = 'none';
  fetchLinks();
});

function startEdit(link) {
  idField.value = link.id;
  nameField.value = link.name;
  urlField.value = link.url;
  tagsField.value = (link.tags || []).join(', ');
  submitBtn.textContent = 'Save changes';
  cancelBtn.style.display = 'inline-block';
  nameField.focus();
}

function resetForm() {
  idField.value = '';
  form.reset();
  submitBtn.textContent = 'Add link';
  cancelBtn.style.display = 'none';
}

cancelBtn.addEventListener('click', resetForm);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const tags = tagsField.value.split(',').map((t) => t.trim()).filter(Boolean);
  const payload = { name: nameField.value.trim(), url: urlField.value.trim(), tags };
  const id = idField.value;
  const res = await fetch(id ? `/api/links/${id}` : '/api/links', {
    method: id ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  if (res.status === 401) return handleSessionExpired();
  if (!res.ok) {
    alert('Failed to save link: ' + (await res.text()));
    return;
  }
  resetForm();
  fetchLinks();
});

async function deleteLink(link) {
  if (!confirm(`Delete "${link.name}"? This can't be undone.`)) return;
  const res = await fetch(`/api/links/${link.id}`, { method: 'DELETE' });
  if (res.status === 401) return handleSessionExpired();
  if (!res.ok && res.status !== 204) {
    alert('Failed to delete link: ' + (await res.text()));
    return;
  }
  fetchLinks();
}

function handleSessionExpired() {
  currentUser = null;
  renderAuthUI();
  alert('Your session has expired. Please log in again.');
}

searchBox.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(fetchLinks, 200);
});

checkAuth();
fetchLinks();
</script>
</body>
</html>
