name: Release binary

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Build release binary
        run: cargo build --release --locked --verbose

      - name: Rename binary for release
        run: |
          asset="linkrs-${{ github.event.release.tag_name }}-x86_64-unknown-linux-gnu"
          cp target/release/linkrs "$asset"
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber

  publish-image:
    runs-on: ubuntu-latest

    # Scoped to this job, overriding the workflow-level `contents: write`:
    # pushing a package needs `packages: write`, and this job only reads the
    # repository.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Derive image tags from the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Image tags drop the `v` the git tag carries (`v0.9.0` -> `0.9.0`),
          # matching the tags already published on GHCR and the pin in
          # docker-compose.yml.
          image="ghcr.io/${{ github.repository }}"
          tags="${image}:${TAG#v}"
          # A prerelease shouldn't take over `latest` from the current stable
          # release.
          if [ "$PRERELEASE" != "true" ]; then
            tags="${tags},${image}:latest"
          fi
          echo "IMAGE_TAGS=${tags}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
